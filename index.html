<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NAVIGATOR">
  <meta name="theme-color" content="#0a0806">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>NAVIGATOR — Winnipeg</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <!-- leaflet-rotate: gives the map a heading-up GTA V style bearing. Optional — app degrades gracefully if it fails. -->
  <script src="https://cdn.jsdelivr.net/gh/Raruto/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0a0806;
      font-family: 'Oswald', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    #app {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    @keyframes barld { 0% { width: 0 } 100% { width: 100% } }
    @keyframes blink2 { 50% { opacity: 0 } }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity:.9 } 50% { transform: scale(1.15); opacity:.5 } }
    /* GTA V map tile filter — desaturated, warm, dark, high contrast */
    .leaflet-tile-pane {
      filter: sepia(.5) saturate(.5) brightness(.78) contrast(1.22) hue-rotate(-6deg);
    }
    .leaflet-control-zoom,
    .leaflet-control-attribution { display: none !important; }
    /* Darkened vignette edges — signature minimap look */
    #vig {
      position:absolute; inset:0; z-index:50; pointer-events:none;
      box-shadow: inset 0 0 140px 30px rgba(0,0,0,.55);
    }
    /* GTA V style popups */
    .leaflet-popup-content-wrapper {
      background: rgba(10, 8, 5, .96) !important;
      border-left: 3px solid #c000b0 !important;
      border-radius: 0 !important;
      box-shadow: 2px 2px 8px rgba(0,0,0,.7) !important;
    }
    .leaflet-popup-content {
      color: #fff !important;
      font-family: 'Oswald', sans-serif !important;
      font-size: 14px !important;
      line-height: 1.5 !important;
      margin: 8px 12px !important;
    }
    .leaflet-popup-tip-container { display: none !important; }
    .leaflet-popup-close-button {
      color: #aaa !important;
      font-size: 16px !important;
      top: 4px !important;
      right: 6px !important;
    }
    .sr-row:hover { background: #1e1c18 !important; }
    .ctl-btn {
      width:42px;height:42px;background:rgba(8,6,4,.85);border:1.5px solid rgba(255,255,255,.22);
      display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;
      backdrop-filter:blur(2px);transition:all .2s;user-select:none;
    }
    .ctl-btn:active { transform:scale(.92); }
    .pop-wp-btn {
      margin-top:8px;background:#c000b0;color:white;border:none;padding:6px 0;
      font:600 12px 'Oswald',sans-serif;cursor:pointer;letter-spacing:1px;width:100%;text-align:center;
    }
    .pop-wp-btn:active { background:#a000a0; }
  </style>
</head>
<body>
<div id="app">
  <!-- LOADING SCREEN -->
  <div id="ls" style="position:absolute;inset:0;background:#0a0806;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .6s;">
    <div style="width:60px;height:4px;background:#c8aa5a;margin-bottom:4px;"></div>
    <div style="color:#c8aa5a;font:700 32px 'Oswald',sans-serif;letter-spacing:10px;text-transform:uppercase;">NAVIGATOR</div>
    <div style="color:rgba(200,170,90,.45);font:400 10px 'Oswald',sans-serif;letter-spacing:5px;text-transform:uppercase;">Winnipeg — Grand Theft Auto Style</div>
    <div style="width:240px;height:4px;background:#1e1a14;border:1px solid #2e2a22;overflow:hidden;margin-top:8px;">
      <div style="height:100%;background:#c8aa5a;width:0;animation:barld 2.2s ease-out .3s forwards;"></div>
    </div>
    <div id="lm" style="color:#c8aa5a;font:400 10px 'Oswald',sans-serif;letter-spacing:3px;animation:blink2 .8s step-end infinite;margin-top:4px;">LOADING...</div>
    <div style="width:60px;height:4px;background:#c8aa5a;margin-top:4px;"></div>
  </div>
  <!-- MAP -->
  <div id="map" style="position:absolute;inset:0;z-index:1;background:#0a0806;"></div>
  <div id="vig"></div>
  <!-- SEARCH BAR (top center) -->
  <div style="position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:300;width:min(330px,84%);">
    <div style="display:flex;background:#0a0806;border:1px solid #3a3020;">
      <input id="srch" type="text" placeholder="SEARCH WINNIPEG LOCATION..."
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
        style="flex:1;background:transparent;border:none;color:white;font:500 12px 'Oswald',sans-serif;padding:9px 12px;outline:none;letter-spacing:.8px;"
        oninput="sched(this.value)"
        onkeydown="if(event.key==='Enter'){event.preventDefault();doS(this.value);}"
        onblur="setTimeout(hideR, 250)"
        onfocus="if(this.value.trim()&&SR.length) document.getElementById('sres').style.display='block'">
      <button onclick="doS(document.getElementById('srch').value)"
        style="background:#c8aa5a;border:none;color:#0a0806;font:700 12px 'Oswald',sans-serif;padding:0 14px;cursor:pointer;letter-spacing:1px;flex-shrink:0;">GO</button>
    </div>
    <div id="sres" style="display:none;background:#0a0806;border:1px solid #3a3020;border-top:none;max-height:240px;overflow-y:auto;"></div>
  </div>
  <!-- DISTANCE / ETA DISPLAY (center, above bottom bar) -->
  <div id="dist" style="position:absolute;bottom:60px;left:50%;transform:translateX(-50%);z-index:200;display:none;align-items:center;gap:10px;background:rgba(8,6,4,.9);padding:6px 16px;white-space:nowrap;border:1px solid #2a241a;">
    <span style="color:#c000b0;font:700 22px 'Oswald',sans-serif;line-height:1;">◆</span>
    <span id="dval" style="color:white;font:600 17px 'Oswald',sans-serif;letter-spacing:1px;">0 m</span>
    <span id="deta" style="color:#c8aa5a;font:500 13px 'Oswald',sans-serif;letter-spacing:.5px;"></span>
  </div>
  <!-- COMPASS (bottom-left, above bar) — tap to toggle heading-up / north-up -->
  <div id="comp" onclick="toggleHeadingUp()" title="Toggle heading-up" style="position:absolute;bottom:62px;left:14px;z-index:200;width:34px;height:34px;background:rgba(8,6,4,.85);border-radius:50%;border:1.5px solid rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;cursor:pointer;">
    <div id="compinner" style="transition:transform .25s;display:flex;flex-direction:column;align-items:center;line-height:.8;">
      <span style="color:#e84040;font:700 9px 'Oswald',sans-serif;">▲</span>
      <span style="color:white;font:700 13px 'Oswald',sans-serif;">N</span>
    </div>
  </div>
  <!-- LOCATE / FOLLOW BUTTON (bottom-right, above bar) -->
  <div id="loc" onclick="recenter()" title="Center on my location" class="ctl-btn" style="position:absolute;bottom:62px;right:14px;z-index:200;border-radius:50%;">
    <svg width="22" height="22" viewBox="0 0 24 24" id="locicon">
      <circle cx="12" cy="12" r="3.4" fill="none" stroke="currentColor" stroke-width="2"/>
      <line x1="12" y1="1.5" x2="12" y2="5.5" stroke="currentColor" stroke-width="2"/>
      <line x1="12" y1="18.5" x2="12" y2="22.5" stroke="currentColor" stroke-width="2"/>
      <line x1="1.5" y1="12" x2="5.5" y2="12" stroke="currentColor" stroke-width="2"/>
      <line x1="18.5" y1="12" x2="22.5" y2="12" stroke="currentColor" stroke-width="2"/>
    </svg>
  </div>
  <!-- BOTTOM GTA V HUD BAR -->
  <div style="position:absolute;bottom:0;left:0;right:0;height:52px;background:#0a0806;border-top:2px solid #221e16;display:flex;align-items:center;gap:5px;padding:6px 10px;z-index:200;">
    <div onclick="toggleZoom()" title="Toggle overview" style="background:#1e5c2a;color:white;font:700 15px 'Oswald',sans-serif;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid #297a36;flex-shrink:0;letter-spacing:1px;user-select:none;">M</div>
    <div style="flex:2.2;position:relative;height:17px;background:#111;border:1px solid #1e1e1e;overflow:hidden;">
      <div style="position:absolute;top:0;left:0;height:100%;width:84%;background:linear-gradient(90deg,#00dd3a,#009919);"></div>
      <div style="position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent,transparent 16px,rgba(0,0,0,.14)16px,rgba(0,0,0,.14)17px);pointer-events:none;"></div>
    </div>
    <div style="flex:1.4;position:relative;height:17px;background:#111;border:1px solid #1e1e1e;overflow:hidden;">
      <div style="position:absolute;top:0;left:0;height:100%;width:62%;background:linear-gradient(90deg,#2299ff,#1166cc);"></div>
    </div>
    <div onclick="showHelp()" title="Help" style="background:#222;border:1px solid #555;color:#bbb;font:600 12px 'Oswald',sans-serif;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;user-select:none;">?</div>
    <div id="wpdot" onclick="clearWP()" title="Clear waypoint" style="opacity:.28;transition:opacity .3s;flex-shrink:0;cursor:pointer;">
      <svg width="24" height="24" viewBox="0 0 24 24">
        <defs>
          <pattern id="ck" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
            <rect width="6" height="6" fill="#c000b0"/>
            <rect width="3" height="3" fill="#880088"/>
            <rect x="3" y="3" width="3" height="3" fill="#880088"/>
          </pattern>
        </defs>
        <polygon points="12,1 23,12 12,23 1,12" fill="url(#ck)" stroke="#ff44cc" stroke-width="1.5"/>
      </svg>
    </div>
  </div>
  <!-- TOAST (top-right GTA V notification style) -->
  <div id="tst" style="position:absolute;top:60px;right:12px;z-index:500;display:none;background:#0a0806;border-left:3px solid #c8aa5a;color:#fff;font:500 12px 'Oswald',sans-serif;padding:8px 14px;letter-spacing:.8px;pointer-events:none;max-width:230px;"></div>
</div>
<script>
const WIN = [49.8951, -97.1384];
let map, pMk, accCircle, poiLyr, poiTmr, stmr;
let rtLine = null, wpMk = null;
let pLL = L.latLng(...WIN);
let heading = 0;            // current device heading in degrees
let zoomed = false;
let follow = false;         // map keeps player centered
let headingUp = false;      // map rotates so travel direction is up (GTA V style)
let canRotate = false;      // leaflet-rotate available?
let gotFix = false;         // received a real GPS fix yet?
let lastRouteAt = 0;        // throttle route recalculation
let SR = [];                // current search results
// Loading messages
const LM = ['LOADING MAP...', 'LOADING WINNIPEG...', 'ACQUIRING GPS...', 'LOADING LOCATIONS...', 'READY'];
let lmi = 0;
const lmInt = setInterval(() => {
  const e = document.getElementById('lm');
  if (e && lmi < LM.length) e.textContent = LM[lmi++];
  else clearInterval(lmInt);
}, 440);
// Register service worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(console.warn);
  });
}
setTimeout(boot, 2500);
function boot() {
  const ls = document.getElementById('ls');
  ls.style.opacity = '0';
  setTimeout(() => ls.style.display = 'none', 680);
  map = L.map('map', {
    center: WIN,
    zoom: 15,
    zoomControl: false,
    attributionControl: false,
    rotate: true,            // ignored if plugin missing
    touchRotate: false,
    bearing: 0
  });
  canRotate = typeof map.setBearing === 'function';
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    maxZoom: 19,
    subdomains: 'abcd'
  }).addTo(map);
  poiLyr = L.layerGroup().addTo(map);
  // GPS accuracy circle (sits under the player marker)
  accCircle = L.circle(WIN, { radius: 0, color: '#69b4ff', weight: 1, opacity: .35, fillColor: '#69b4ff', fillOpacity: .08, interactive: false }).addTo(map);
  // Player white arrow with GTA V style vision cone
  pMk = L.marker(WIN, {
    icon: L.divIcon({
      className: '',
      html: `<div id="parr" style="width:60px;height:60px;transition:transform .25s;">
        <svg width="60" height="60" viewBox="0 0 60 60" style="overflow:visible">
          <defs>
            <linearGradient id="cone" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0" stop-color="#ffffff" stop-opacity=".42"/>
              <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <polygon points="30,34 7,2 53,2" fill="url(#cone)"/>
          <polygon points="30,16 40,43 30,37 20,43" fill="#fff" stroke="rgba(0,0,0,.65)" stroke-width="2" stroke-linejoin="round"/>
        </svg></div>`,
      iconSize: [60, 60],
      iconAnchor: [30, 30]
    }),
    zIndexOffset: 9000
  }).addTo(map);
  map.on('click', e => setWP(e.latlng, null, false));
  map.on('moveend', loadPOIs);
  // User dragging the map turns off follow
  map.on('dragstart', () => { if (follow) { follow = false; updLocBtn(); } });
  startGPS();
  setTimeout(loadPOIs, 500);
  updLocBtn();
}
// ── BEARING / ROTATION ─────────────────────────────────
function applyBearing() {
  const b = (headingUp && canRotate) ? heading : 0;
  if (canRotate) { try { map.setBearing(b); } catch {} }
  // Compass needle points to true north relative to the rotated view
  const ci = document.getElementById('compinner');
  if (ci) ci.style.transform = `rotate(${-b}deg)`;
  // When heading-up, the world rotates so the arrow stays pointing up;
  // otherwise the arrow itself rotates to show heading.
  const a = document.getElementById('parr');
  if (a) a.style.transform = `rotate(${(headingUp && canRotate) ? 0 : heading}deg)`;
}
function toggleHeadingUp() {
  if (!canRotate) { toast('ROTATION UNAVAILABLE'); return; }
  headingUp = !headingUp;
  if (headingUp) { follow = true; updLocBtn(); centerOnPlayer(); }
  applyBearing();
  toast(headingUp ? 'HEADING UP' : 'NORTH UP');
}
// ── FOLLOW / RECENTER ──────────────────────────────────
function centerOnPlayer() {
  map.setView(pLL, map.getZoom(), { animate: true });
}
function recenter() {
  follow = true;
  updLocBtn();
  map.flyTo(pLL, Math.max(map.getZoom(), 16), { duration: .8 });
  toast(gotFix ? 'CENTERED ON YOU' : 'WAITING FOR GPS...');
}
function updLocBtn() {
  const b = document.getElementById('loc');
  if (!b) return;
  if (follow) {
    b.style.color = '#00dd4a';
    b.style.borderColor = '#00dd4a';
    b.style.boxShadow = '0 0 10px rgba(0,221,74,.5)';
  } else {
    b.style.color = '#fff';
    b.style.borderColor = 'rgba(255,255,255,.22)';
    b.style.boxShadow = 'none';
  }
}
// ── WAYPOINT ───────────────────────────────────────────
function setWP(ll, name, fit) {
  clearWP(true);
  wpMk = L.marker(ll, {
    icon: L.divIcon({
      className: '',
      html: `<div style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;">
        <svg width="26" height="26" viewBox="0 0 26 26">
          <defs>
            <pattern id="ck2" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
              <rect width="6" height="6" fill="#c000b0"/>
              <rect width="3" height="3" fill="#880088"/>
              <rect x="3" y="3" width="3" height="3" fill="#880088"/>
            </pattern>
          </defs>
          <polygon points="13,1 25,13 13,25 1,13" fill="url(#ck2)" stroke="#ff44cc" stroke-width="1.5"/>
          <line x1="1" y1="13" x2="25" y2="13" stroke="rgba(80,0,80,.5)" stroke-width="1"/>
          <line x1="13" y1="1" x2="13" y2="25" stroke="rgba(80,0,80,.5)" stroke-width="1"/>
        </svg></div>`,
      iconSize: [28, 28],
      iconAnchor: [14, 14]
    }),
    zIndexOffset: 8000
  }).addTo(map);
  document.getElementById('dist').style.display = 'flex';
  document.getElementById('wpdot').style.opacity = '1';
  updDist(ll);
  getRoute(pLL, ll, fit);
  toast(name ? `WAYPOINT: ${name.toUpperCase()}` : 'WAYPOINT SET');
}
function clearWP(silent) {
  if (wpMk) { map.removeLayer(wpMk); wpMk = null; }
  if (rtLine) { map.removeLayer(rtLine); rtLine = null; }
  if (!silent) {
    document.getElementById('dist').style.display = 'none';
    document.getElementById('wpdot').style.opacity = '.28';
    document.getElementById('deta').textContent = '';
    toast('WAYPOINT CLEARED');
  }
}
// ── ROUTING (OSRM) ─────────────────────────────────────
async function getRoute(from, to, fit) {
  if (rtLine) { map.removeLayer(rtLine); rtLine = null; }
  lastRouteAt = Date.now();
  try {
    const r = await fetch(
      `https://router.project-osrm.org/route/v1/driving/${from.lng},${from.lat};${to.lng},${to.lat}?overview=full&geometries=geojson`
    );
    const d = await r.json();
    if (d.routes?.[0]) {
      const route = d.routes[0];
      const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);
      // Casing under the route for that bold GTA GPS-line look
      rtLine = L.layerGroup([
        L.polyline(coords, { color: '#5a005a', weight: 10, opacity: .55 }),
        L.polyline(coords, { color: '#e000d0', weight: 5, opacity: .95 })
      ]).addTo(map);
      setDistM(route.distance, route.duration);
      if (fit) map.fitBounds(L.latLngBounds(coords), { padding: [60, 60], maxZoom: 16 });
      return;
    }
  } catch {}
  // Fallback: straight dashed line
  rtLine = L.polyline([from, to], { color: '#c000b0', weight: 4, opacity: .75, dashArray: '10,7' }).addTo(map);
  if (fit) map.fitBounds(L.latLngBounds([from, to]), { padding: [60, 60], maxZoom: 16 });
}
// ── DISTANCE / ETA ─────────────────────────────────────
function updDist(ll) { setDistM(hvs(pLL.lat, pLL.lng, ll.lat, ll.lng), null); }
function setDistM(m, secs) {
  const e = document.getElementById('dval');
  if (e) e.textContent = m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(2) + ' km';
  const et = document.getElementById('deta');
  if (et && secs != null) {
    const min = Math.round(secs / 60);
    et.textContent = min < 60 ? `~${min} MIN` : `~${Math.floor(min / 60)}H ${min % 60}M`;
  }
}
function hvs(a, b, c, d) {
  const R = 6371e3, r = Math.PI / 180, dφ = (c - a) * r, dλ = (d - b) * r;
  const x = Math.sin(dφ / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin(dλ / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
}
// ── GPS ────────────────────────────────────────────────
function startGPS() {
  if (!navigator.geolocation) { toast('NO GPS SUPPORT'); return; }
  navigator.geolocation.watchPosition(p => {
    const { latitude: lat, longitude: lng, heading: h, accuracy: acc } = p.coords;
    const prev = pLL;
    pLL = L.latLng(lat, lng);
    pMk.setLatLng(pLL);
    accCircle.setLatLng(pLL);
    if (acc != null) accCircle.setRadius(acc);
    if (!gotFix) {
      gotFix = true;
      follow = true; updLocBtn();
      map.setView(pLL, 16);
      toast('GPS LOCKED');
    }
    // Update heading from GPS course when available
    if (h != null && !isNaN(h)) { heading = h; applyBearing(); }
    if (follow) map.panTo(pLL, { animate: true, duration: .5 });
    if (wpMk) {
      updDist(wpMk.getLatLng());
      // Recalculate the road route periodically as you drive
      if (Date.now() - lastRouteAt > 12000 && hvs(prev.lat, prev.lng, lat, lng) > 25) {
        getRoute(pLL, wpMk.getLatLng(), false);
      }
    }
  }, err => {
    toast(err.code === 1 ? 'GPS PERMISSION DENIED' : 'GPS UNAVAILABLE');
  }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
}
// ── POI LOADING (Overpass API) ─────────────────────────
async function loadPOIs() {
  if (!poiLyr || !map) return;
  if (map.getZoom() < 14) { poiLyr.clearLayers(); return; }
  clearTimeout(poiTmr);
  poiTmr = setTimeout(async () => {
    const b = map.getBounds();
    const q = `[out:json][timeout:12];node["amenity"~"restaurant|cafe|fast_food|fuel|hospital|pharmacy|bank|bar|hotel|supermarket|police|parking|pub|atm|school|convenience"](${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()});out body;`;
    try {
      const r = await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(q)}`);
      const d = await r.json();
      poiLyr.clearLayers();
      d.elements.slice(0, 180).forEach(el => {
        if (!el.lat || !el.lon) return;
        const { c, t } = pSt(el.tags.amenity);
        const nm = el.tags.name || t;
        const mk = L.marker([el.lat, el.lon], {
          icon: L.divIcon({
            className: '',
            html: `<div style="width:11px;height:11px;background:${c};border-radius:50%;border:1.5px solid rgba(0,0,0,.5);box-shadow:0 0 4px rgba(0,0,0,.4);"></div>`,
            iconSize: [11, 11],
            iconAnchor: [5.5, 5.5]
          })
        });
        mk.bindPopup(buildPoiPopup(nm, t, el.tags['addr:street'], el.lat, el.lon));
        mk.addTo(poiLyr);
      });
    } catch { /* Fail silently */ }
  }, 700);
}
// Build POI popup as real DOM so the button works regardless of name characters
function buildPoiPopup(nm, t, street, lat, lon) {
  const wrap = document.createElement('div');
  const title = document.createElement('div');
  title.style.cssText = "font:600 15px 'Oswald',sans-serif;letter-spacing:.5px;";
  title.textContent = nm;
  wrap.appendChild(title);
  const type = document.createElement('div');
  type.style.cssText = "font:400 12px 'Oswald';color:#aaa;margin-top:2px;";
  type.textContent = t;
  wrap.appendChild(type);
  if (street) {
    const st = document.createElement('div');
    st.style.cssText = "font:400 11px 'Oswald';color:#888;margin-top:1px;";
    st.textContent = street;
    wrap.appendChild(st);
  }
  const btn = document.createElement('button');
  btn.className = 'pop-wp-btn';
  btn.textContent = 'SET WAYPOINT ✚';
  btn.addEventListener('click', () => { setWP(L.latLng(lat, lon), nm, false); startNav(); map.closePopup(); });
  wrap.appendChild(btn);
  return wrap;
}
function pSt(a) {
  return ({
    restaurant: { c: '#e8780a', t: 'Restaurant' },
    cafe:        { c: '#cc6600', t: 'Café' },
    fast_food:   { c: '#ff4400', t: 'Fast Food' },
    fuel:        { c: '#f0d000', t: 'Gas Station' },
    hospital:    { c: '#dd2222', t: 'Hospital' },
    pharmacy:    { c: '#00cc44', t: 'Pharmacy' },
    bank:        { c: '#00aa22', t: 'Bank' },
    atm:         { c: '#009900', t: 'ATM' },
    bar:         { c: '#aa0033', t: 'Bar' },
    pub:         { c: '#aa0033', t: 'Pub' },
    hotel:       { c: '#aa44cc', t: 'Hotel' },
    supermarket: { c: '#00aaee', t: 'Supermarket' },
    convenience: { c: '#0088cc', t: 'Convenience' },
    police:      { c: '#2244dd', t: 'Police' },
    parking:     { c: '#6688aa', t: 'Parking' },
    school:      { c: '#ccaa00', t: 'School' },
  })[a] || { c: '#888888', t: a || 'Place' };
}
// ── SEARCH (Nominatim) ─────────────────────────────────
function sched(v) {
  clearTimeout(stmr);
  if (!v.trim()) { hideR(); return; }
  stmr = setTimeout(() => doS(v), 380);
}
async function doS(q) {
  if (!q.trim()) return;
  const el = document.getElementById('sres');
  el.innerHTML = `<div style="padding:9px 12px;color:#888;font:400 11px 'Oswald',sans-serif;letter-spacing:1px;">SEARCHING WINNIPEG...</div>`;
  el.style.display = 'block';
  try {
    const r = await fetch(
      `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&viewbox=-97.39,50.02,-96.92,49.77&bounded=1&format=json&limit=6&addressdetails=1`,
      { headers: { 'Accept-Language': 'en' } }
    );
    SR = await r.json();
    if (!SR.length) {
      el.innerHTML = `<div style="padding:9px 12px;color:#666;font:400 11px 'Oswald',sans-serif;letter-spacing:1px;">NO RESULTS FOUND IN WINNIPEG</div>`;
      return;
    }
    el.innerHTML = '';
    SR.forEach((x, i) => {
      const parts = x.display_name.split(',');
      const row = document.createElement('div');
      row.className = 'sr-row';
      row.style.cssText = 'padding:9px 12px;cursor:pointer;border-bottom:1px solid #1a1814;color:#ddd;';
      const a = document.createElement('div');
      a.style.cssText = "font:600 13px 'Oswald',sans-serif;color:white;letter-spacing:.5px;";
      a.textContent = parts[0];
      const b = document.createElement('div');
      b.style.cssText = "font:400 11px 'Oswald',sans-serif;color:#666;margin-top:1px;";
      b.textContent = parts.slice(1, 3).join(',').trim();
      row.appendChild(a); row.appendChild(b);
      // mousedown beats the input's blur-hide race
      row.addEventListener('mousedown', e => { e.preventDefault(); pickR(i); });
      el.appendChild(row);
    });
  } catch {
    el.innerHTML = `<div style="padding:9px 12px;color:#cc5500;font:400 11px 'Oswald',sans-serif;letter-spacing:.5px;">SEARCH UNAVAILABLE</div>`;
  }
}
function pickR(i) {
  const x = SR[i];
  if (!x) return;
  const name = x.display_name.split(',')[0];
  const ll = L.latLng(parseFloat(x.lat), parseFloat(x.lon));
  setWP(ll, name, false);          // sets waypoint + draws route (no fit)
  startNav();                      // zoom in close & follow, like turn-by-turn
  document.getElementById('srch').value = name;
  document.getElementById('srch').blur();
  hideR();
}
// Enter close-up turn-by-turn style navigation view on the player
function startNav() {
  follow = true;
  if (canRotate) headingUp = true;
  updLocBtn();
  applyBearing();
  map.flyTo(pLL, 17, { duration: 1.0 });
}
function hideR() { document.getElementById('sres').style.display = 'none'; }
// ── UTILS ──────────────────────────────────────────────
function toggleZoom() {
  zoomed = !zoomed;
  const c = follow ? pLL : map.getCenter();
  map.flyTo(c, zoomed ? 11 : 16, { duration: 1.2 });
  toast(zoomed ? 'OVERVIEW MAP' : 'STREET VIEW');
}
function showHelp() {
  toast('TAP MAP = WAYPOINT · ◎ = FOLLOW · N = ROTATE · M = ZOOM · ◆ = CLEAR');
}
function toast(m) {
  const t = document.getElementById('tst');
  t.textContent = m;
  t.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.style.display = 'none', 2900);
}
</script>
