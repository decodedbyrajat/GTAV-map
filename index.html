<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NAVIGATOR">
  <meta name="theme-color" content="#0a0806">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>NAVIGATOR — Winnipeg</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"/>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0a0806;
      font-family: 'Oswald', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    #app { position: relative; width: 100%; height: 100%; overflow: hidden; }
    @keyframes barld { 0% { width: 0 } 100% { width: 100% } }
    @keyframes blink2 { 50% { opacity: 0 } }
    .maplibregl-ctrl-attrib, .maplibregl-ctrl-logo { display: none !important; }
    /* Darkened vignette edges — minimap look */
    #vig { position:absolute; inset:0; z-index:50; pointer-events:none; box-shadow: inset 0 0 130px 24px rgba(0,0,0,.42); }
    /* GTA style popups */
    .maplibregl-popup-content {
      background: rgba(10, 8, 5, .96) !important;
      border-left: 3px solid #c000b0 !important;
      border-radius: 0 !important;
      box-shadow: 2px 2px 8px rgba(0,0,0,.7) !important;
      color: #fff !important; font-family: 'Oswald', sans-serif !important; padding: 9px 12px !important;
    }
    .maplibregl-popup-tip { display:none !important; }
    .maplibregl-popup-close-button { color:#aaa !important; font-size:18px !important; right:4px !important; }
    .sr-row:hover { background: #1e1c18 !important; }
    .ctl-btn {
      width:42px;height:42px;background:rgba(8,6,4,.85);border:1.5px solid rgba(255,255,255,.22);
      display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;transition:all .2s;user-select:none;
    }
    .ctl-btn:active { transform:scale(.92); }
    .pop-wp-btn { margin-top:8px;background:#c000b0;color:white;border:none;padding:6px 0;font:600 12px 'Oswald',sans-serif;cursor:pointer;letter-spacing:1px;width:100%;text-align:center; }
    .pop-wp-btn:active { background:#a000a0; }
  </style>
</head>
<body>
<div id="app">
  <!-- LOADING SCREEN -->
  <div id="ls" style="position:absolute;inset:0;background:#0a0806;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .6s;">
    <div style="width:60px;height:4px;background:#c8aa5a;margin-bottom:4px;"></div>
    <div style="color:#c8aa5a;font:700 32px 'Oswald',sans-serif;letter-spacing:10px;text-transform:uppercase;">NAVIGATOR</div>
    <div style="color:rgba(200,170,90,.45);font:400 10px 'Oswald',sans-serif;letter-spacing:5px;text-transform:uppercase;">Winnipeg — San Andreas Style</div>
    <div style="width:240px;height:4px;background:#1e1a14;border:1px solid #2e2a22;overflow:hidden;margin-top:8px;">
      <div style="height:100%;background:#c8aa5a;width:0;animation:barld 2.2s ease-out .3s forwards;"></div>
    </div>
    <div id="lm" style="color:#c8aa5a;font:400 10px 'Oswald',sans-serif;letter-spacing:3px;animation:blink2 .8s step-end infinite;margin-top:4px;">LOADING...</div>
    <div style="width:60px;height:4px;background:#c8aa5a;margin-top:4px;"></div>
  </div>
  <!-- MAP -->
  <div id="map" style="position:absolute;inset:0;z-index:1;background:#a9a399;"></div>
  <div id="vig"></div>
  <!-- SEARCH BAR -->
  <div style="position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:300;width:min(330px,84%);">
    <div style="display:flex;background:#0a0806;border:1px solid #3a3020;">
      <input id="srch" type="text" placeholder="SEARCH WINNIPEG LOCATION..."
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
        style="flex:1;background:transparent;border:none;color:white;font:500 12px 'Oswald',sans-serif;padding:9px 12px;outline:none;letter-spacing:.8px;"
        oninput="sched(this.value)"
        onkeydown="if(event.key==='Enter'){event.preventDefault();doS(this.value);}"
        onblur="setTimeout(hideR, 250)"
        onfocus="if(this.value.trim()&&SR.length) document.getElementById('sres').style.display='block'">
      <button onclick="doS(document.getElementById('srch').value)"
        style="background:#c8aa5a;border:none;color:#0a0806;font:700 12px 'Oswald',sans-serif;padding:0 14px;cursor:pointer;letter-spacing:1px;flex-shrink:0;">GO</button>
    </div>
    <div id="sres" style="display:none;background:#0a0806;border:1px solid #3a3020;border-top:none;max-height:240px;overflow-y:auto;"></div>
  </div>
  <!-- DISTANCE / ETA -->
  <div id="dist" style="position:absolute;bottom:60px;left:50%;transform:translateX(-50%);z-index:200;display:none;align-items:center;gap:10px;background:rgba(8,6,4,.9);padding:6px 16px;white-space:nowrap;border:1px solid #2a241a;">
    <span style="color:#c000b0;font:700 22px 'Oswald',sans-serif;line-height:1;">◆</span>
    <span id="dval" style="color:white;font:600 17px 'Oswald',sans-serif;letter-spacing:1px;">0 m</span>
    <span id="deta" style="color:#c8aa5a;font:500 13px 'Oswald',sans-serif;letter-spacing:.5px;"></span>
  </div>
  <!-- COMPASS -->
  <div id="comp" onclick="toggleHeadingUp()" title="Toggle heading-up" style="position:absolute;bottom:62px;left:14px;z-index:200;width:34px;height:34px;background:rgba(8,6,4,.85);border-radius:50%;border:1.5px solid rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;cursor:pointer;">
    <div id="compinner" style="transition:transform .2s;display:flex;flex-direction:column;align-items:center;line-height:.8;">
      <span style="color:#e84040;font:700 9px 'Oswald',sans-serif;">▲</span>
      <span style="color:white;font:700 13px 'Oswald',sans-serif;">N</span>
    </div>
  </div>
  <!-- LOCATE / FOLLOW -->
  <div id="loc" onclick="recenter()" title="Center on my location" class="ctl-btn" style="position:absolute;bottom:62px;right:14px;z-index:200;border-radius:50%;">
    <svg width="22" height="22" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3.4" fill="none" stroke="currentColor" stroke-width="2"/>
      <line x1="12" y1="1.5" x2="12" y2="5.5" stroke="currentColor" stroke-width="2"/>
      <line x1="12" y1="18.5" x2="12" y2="22.5" stroke="currentColor" stroke-width="2"/>
      <line x1="1.5" y1="12" x2="5.5" y2="12" stroke="currentColor" stroke-width="2"/>
      <line x1="18.5" y1="12" x2="22.5" y2="12" stroke="currentColor" stroke-width="2"/>
    </svg>
  </div>
  <!-- BOTTOM HUD BAR -->
  <div style="position:absolute;bottom:0;left:0;right:0;height:52px;background:#0a0806;border-top:2px solid #221e16;display:flex;align-items:center;gap:5px;padding:6px 10px;z-index:200;">
    <div onclick="toggleZoom()" title="Toggle overview" style="background:#1e5c2a;color:white;font:700 15px 'Oswald',sans-serif;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid #297a36;flex-shrink:0;letter-spacing:1px;user-select:none;">M</div>
    <div style="flex:2.2;position:relative;height:17px;background:#111;border:1px solid #1e1e1e;overflow:hidden;">
      <div style="position:absolute;top:0;left:0;height:100%;width:84%;background:linear-gradient(90deg,#00dd3a,#009919);"></div>
      <div style="position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent,transparent 16px,rgba(0,0,0,.14)16px,rgba(0,0,0,.14)17px);pointer-events:none;"></div>
    </div>
    <div style="flex:1.4;position:relative;height:17px;background:#111;border:1px solid #1e1e1e;overflow:hidden;">
      <div style="position:absolute;top:0;left:0;height:100%;width:62%;background:linear-gradient(90deg,#2299ff,#1166cc);"></div>
    </div>
    <div onclick="showHelp()" title="Help" style="background:#222;border:1px solid #555;color:#bbb;font:600 12px 'Oswald',sans-serif;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;user-select:none;">?</div>
    <div id="wpdot" onclick="clearWP()" title="Clear waypoint" style="opacity:.28;transition:opacity .3s;flex-shrink:0;cursor:pointer;">
      <svg width="24" height="24" viewBox="0 0 24 24">
        <defs>
          <pattern id="ck" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
            <rect width="6" height="6" fill="#c000b0"/>
            <rect width="3" height="3" fill="#880088"/>
            <rect x="3" y="3" width="3" height="3" fill="#880088"/>
          </pattern>
        </defs>
        <polygon points="12,1 23,12 12,23 1,12" fill="url(#ck)" stroke="#ff44cc" stroke-width="1.5"/>
      </svg>
    </div>
  </div>
  <!-- TOAST -->
  <div id="tst" style="position:absolute;top:60px;right:12px;z-index:500;display:none;background:#0a0806;border-left:3px solid #c8aa5a;color:#fff;font:500 12px 'Oswald',sans-serif;padding:8px 14px;letter-spacing:.8px;pointer-events:none;max-width:230px;"></div>
</div>
<script>
const WIN = [-97.1384, 49.8951];   // [lng, lat]
let map, pMk, wpMk;
let pLL = WIN.slice();             // player [lng,lat]
let wp = null;                     // waypoint [lng,lat]
let heading = 0, zoomed = false, follow = false, headingUp = false;
let gotFix = false, lastRouteAt = 0, styleReady = false;
let SR = [];
let VALIDFONT = ['Noto Sans Regular'];

// ── GTA SAN ANDREAS PALETTE ────────────────────────────
const GTA = {
  land:    '#a9a399',  // flat warm grey land
  green:   '#82a24e',  // grass / parks
  wood:    '#6f9440',  // woodland
  water:   '#86adbf',  // muted teal water
  build:   '#c4c0b7',  // light grey buildings
  buildLn: '#aaa69d',
  major:   '#232323',  // motorway / primary — black
  second:  '#6e5440',  // secondary / tertiary — brown
  minor:   '#938678',  // minor / service — grey-brown
  path:    '#7d6450',  // paths
  label:   '#3c382f',  // text
  halo:    '#cfcabf'   // text halo
};

const LM = ['LOADING MAP...', 'LOADING WINNIPEG...', 'ACQUIRING GPS...', 'LOADING LOCATIONS...', 'READY'];
let lmi = 0;
const lmInt = setInterval(() => {
  const e = document.getElementById('lm');
  if (e && lmi < LM.length) e.textContent = LM[lmi++]; else clearInterval(lmInt);
}, 440);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(console.warn));
}

setTimeout(boot, 2500);

function boot() {
  const ls = document.getElementById('ls');
  ls.style.opacity = '0';
  setTimeout(() => ls.style.display = 'none', 680);

  map = new maplibregl.Map({
    container: 'map',
    style: 'https://tiles.openfreemap.org/styles/liberty',  // verified source; we recolor on load
    center: WIN,
    zoom: 14.5,
    pitch: 0,
    bearing: 0,
    attributionControl: false,
    dragRotate: true,
    pitchWithRotate: false
  });

  map.on('load', () => {
    try { applyGtaStyle(); } catch (e) { console.warn('style recolor failed', e); }
    addAppLayers();
    styleReady = true;
    addPlayer();
    startGPS();
    loadPOIs();
  });

  map.on('moveend', loadPOIs);
  map.on('rotate', () => {
    const ci = document.getElementById('compinner');
    if (ci) ci.style.transform = `rotate(${-map.getBearing()}deg)`;
  });
  // User interaction cancels follow
  map.on('dragstart', dropFollow);
  map.on('rotatestart', () => {});
  // Tap empty map to drop a waypoint (ignore taps on POIs)
  map.on('click', e => {
    const f = map.queryRenderedFeatures(e.point, { layers: ['poi-dots'] });
    if (f.length) return;
    setWP([e.lngLat.lng, e.lngLat.lat], null);
  });
  map.on('click', 'poi-dots', e => {
    const f = e.features[0];
    const c = f.geometry.coordinates;
    new maplibregl.Popup({ offset: 14, closeButton: true })
      .setLngLat(c)
      .setDOMContent(buildPoiPopup(f.properties.name, f.properties.type, f.properties.street, c))
      .addTo(map);
  });
  map.on('mouseenter', 'poi-dots', () => map.getCanvas().style.cursor = 'pointer');
  map.on('mouseleave', 'poi-dots', () => map.getCanvas().style.cursor = '');
}

// ── GTA STYLE: replace liberty's layers with SA-coloured ones ──
function applyGtaStyle() {
  const style = map.getStyle();
  // Find the vector source id (usually "openmaptiles")
  let src = null;
  for (const [id, s] of Object.entries(style.sources)) {
    if (s.type === 'vector') { src = id; break; }
  }
  // Capture a valid glyph font from an existing symbol layer
  for (const l of style.layers) {
    if (l.type === 'symbol' && l.layout && l.layout['text-font']) { VALIDFONT = l.layout['text-font']; break; }
  }
  // Remove all of liberty's layers
  for (const l of style.layers) { if (map.getLayer(l.id)) map.removeLayer(l.id); }
  if (!src) return;   // no vector source — leave blank-ish background

  const add = (layer) => { try { map.addLayer(layer); } catch (e) {} };

  add({ id: 'bg', type: 'background', paint: { 'background-color': GTA.land } });

  // Landcover greens
  add({ id: 'wood', type: 'fill', source: src, 'source-layer': 'landcover',
    filter: ['match', ['get', 'class'], ['wood', 'forest'], true, false],
    paint: { 'fill-color': GTA.wood, 'fill-opacity': .85 } });
  add({ id: 'grass', type: 'fill', source: src, 'source-layer': 'landcover',
    filter: ['match', ['get', 'class'], ['grass', 'meadow', 'scrub', 'heath'], true, false],
    paint: { 'fill-color': GTA.green, 'fill-opacity': .7 } });

  // Parks (landuse + dedicated park layer where present)
  add({ id: 'park-lu', type: 'fill', source: src, 'source-layer': 'landuse',
    filter: ['match', ['get', 'class'], ['park', 'recreation_ground', 'pitch', 'garden', 'golf_course', 'cemetery'], true, false],
    paint: { 'fill-color': GTA.green, 'fill-opacity': .8 } });
  add({ id: 'park', type: 'fill', source: src, 'source-layer': 'park',
    paint: { 'fill-color': GTA.green, 'fill-opacity': .8 } });

  // Water
  add({ id: 'water', type: 'fill', source: src, 'source-layer': 'water',
    paint: { 'fill-color': GTA.water } });
  add({ id: 'waterway', type: 'line', source: src, 'source-layer': 'waterway',
    paint: { 'line-color': GTA.water, 'line-width': ['interpolate', ['linear'], ['zoom'], 11, .6, 17, 3] } });

  // Buildings
  add({ id: 'building', type: 'fill', source: src, 'source-layer': 'building',
    minzoom: 13,
    paint: { 'fill-color': GTA.build, 'fill-outline-color': GTA.buildLn, 'fill-opacity': .95 } });

  // Roads — drawn fat & flat like the SA paper map
  add({ id: 'r-minor', type: 'line', source: src, 'source-layer': 'transportation',
    filter: ['match', ['get', 'class'], ['minor', 'service', 'living_street'], true, false],
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': GTA.minor, 'line-width': ['interpolate', ['linear'], ['zoom'], 13, .6, 16, 2.5, 19, 9] } });
  add({ id: 'r-path', type: 'line', source: src, 'source-layer': 'transportation',
    filter: ['match', ['get', 'class'], ['path', 'track', 'footway', 'cycleway', 'pedestrian'], true, false],
    paint: { 'line-color': GTA.path, 'line-width': ['interpolate', ['linear'], ['zoom'], 14, .5, 19, 3], 'line-dasharray': [2, 2] } });
  add({ id: 'r-second', type: 'line', source: src, 'source-layer': 'transportation',
    filter: ['match', ['get', 'class'], ['secondary', 'tertiary'], true, false],
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': GTA.second, 'line-width': ['interpolate', ['linear'], ['zoom'], 11, .8, 15, 3.5, 19, 13] } });
  add({ id: 'r-major', type: 'line', source: src, 'source-layer': 'transportation',
    filter: ['match', ['get', 'class'], ['motorway', 'trunk', 'primary'], true, false],
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': GTA.major, 'line-width': ['interpolate', ['linear'], ['zoom'], 9, 1, 13, 3.5, 16, 7, 19, 20] } });

  // Labels — road names + place names
  add({ id: 'road-labels', type: 'symbol', source: src, 'source-layer': 'transportation_name',
    minzoom: 13,
    layout: { 'symbol-placement': 'line', 'text-field': ['coalesce', ['get', 'name:en'], ['get', 'name']],
      'text-font': VALIDFONT, 'text-size': 11, 'text-letter-spacing': .05 },
    paint: { 'text-color': GTA.label, 'text-halo-color': GTA.halo, 'text-halo-width': 1.4 } });
  add({ id: 'place-labels', type: 'symbol', source: src, 'source-layer': 'place',
    filter: ['match', ['get', 'class'], ['city', 'town', 'suburb', 'neighbourhood', 'village'], true, false],
    layout: { 'text-field': ['coalesce', ['get', 'name:en'], ['get', 'name']], 'text-font': VALIDFONT,
      'text-size': ['interpolate', ['linear'], ['zoom'], 9, 11, 14, 15], 'text-transform': 'uppercase', 'text-letter-spacing': .1 },
    paint: { 'text-color': '#2c281f', 'text-halo-color': GTA.halo, 'text-halo-width': 1.6 } });
}

// ── APP LAYERS (accuracy, route, POIs) ─────────────────
function addAppLayers() {
  const empty = { type: 'FeatureCollection', features: [] };
  map.addSource('acc', { type: 'geojson', data: empty });
  map.addLayer({ id: 'acc-fill', type: 'fill', source: 'acc',
    paint: { 'fill-color': '#69b4ff', 'fill-opacity': .12 } });
  map.addLayer({ id: 'acc-line', type: 'line', source: 'acc',
    paint: { 'line-color': '#69b4ff', 'line-opacity': .4, 'line-width': 1 } });

  map.addSource('route', { type: 'geojson', data: empty });
  map.addLayer({ id: 'route-case', type: 'line', source: 'route',
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#5a005a', 'line-width': ['interpolate', ['linear'], ['zoom'], 12, 6, 18, 14], 'line-opacity': .6 } });
  map.addLayer({ id: 'route-line', type: 'line', source: 'route',
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#e000d0', 'line-width': ['interpolate', ['linear'], ['zoom'], 12, 3, 18, 8] } });

  map.addSource('poi', { type: 'geojson', data: empty });
  map.addLayer({ id: 'poi-dots', type: 'circle', source: 'poi',
    paint: {
      'circle-color': ['get', 'color'],
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 13, 3, 17, 6],
      'circle-stroke-color': 'rgba(0,0,0,.5)', 'circle-stroke-width': 1.3
    } });
}

// ── PLAYER MARKER (white arrow + vision cone) ──────────
function addPlayer() {
  const el = document.createElement('div');
  el.innerHTML = `<div id="parr" style="width:58px;height:58px;transition:transform .2s;">
    <svg width="58" height="58" viewBox="0 0 58 58" style="overflow:visible">
      <defs><linearGradient id="cone" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#ffffff" stop-opacity=".42"/>
        <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient></defs>
      <polygon points="29,33 7,3 51,3" fill="url(#cone)"/>
      <polygon points="29,16 39,42 29,36 19,42" fill="#fff" stroke="rgba(0,0,0,.65)" stroke-width="2" stroke-linejoin="round"/>
    </svg></div>`;
  pMk = new maplibregl.Marker({ element: el, rotationAlignment: 'viewport' }).setLngLat(pLL).addTo(map);
}

// ── BEARING / ROTATION ─────────────────────────────────
function applyHeading() {
  const a = document.getElementById('parr');
  if (headingUp) {
    if (a) a.style.transform = 'rotate(0deg)';
    if (follow) map.easeTo({ bearing: heading, duration: 400 });
  } else {
    if (a) a.style.transform = `rotate(${heading}deg)`;
  }
}
function toggleHeadingUp() {
  headingUp = !headingUp;
  if (headingUp) { follow = true; updLocBtn(); map.easeTo({ center: pLL, bearing: heading, duration: 500 }); }
  else { map.easeTo({ bearing: 0, duration: 500 }); }
  applyHeading();
  toast(headingUp ? 'HEADING UP' : 'NORTH UP');
}

// ── FOLLOW / RECENTER ──────────────────────────────────
function dropFollow() { if (follow) { follow = false; updLocBtn(); } }
function recenter() {
  follow = true; updLocBtn();
  map.easeTo({ center: pLL, zoom: Math.max(map.getZoom(), 16), bearing: headingUp ? heading : map.getBearing(), duration: 800 });
  toast(gotFix ? 'CENTERED ON YOU' : 'WAITING FOR GPS...');
}
function updLocBtn() {
  const b = document.getElementById('loc');
  if (!b) return;
  b.style.color = follow ? '#00dd4a' : '#fff';
  b.style.borderColor = follow ? '#00dd4a' : 'rgba(255,255,255,.22)';
  b.style.boxShadow = follow ? '0 0 10px rgba(0,221,74,.5)' : 'none';
}

// ── WAYPOINT ───────────────────────────────────────────
function setWP(ll, name) {
  wp = ll;
  if (wpMk) wpMk.remove();
  const el = document.createElement('div');
  el.innerHTML = `<svg width="26" height="26" viewBox="0 0 26 26">
    <defs><pattern id="ck2-${Date.now()}" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#c000b0"/><rect width="3" height="3" fill="#880088"/><rect x="3" y="3" width="3" height="3" fill="#880088"/>
    </pattern></defs>
    <polygon points="13,1 25,13 13,25 1,13" fill="#c000b0" stroke="#ff44cc" stroke-width="1.5"/>
    <line x1="1" y1="13" x2="25" y2="13" stroke="rgba(80,0,80,.6)" stroke-width="1"/>
    <line x1="13" y1="1" x2="13" y2="25" stroke="rgba(80,0,80,.6)" stroke-width="1"/></svg>`;
  wpMk = new maplibregl.Marker({ element: el, rotationAlignment: 'viewport' }).setLngLat(ll).addTo(map);
  document.getElementById('dist').style.display = 'flex';
  document.getElementById('wpdot').style.opacity = '1';
  updDist(ll);
  getRoute(pLL, ll);
  startNav();
  toast(name ? `WAYPOINT: ${name.toUpperCase()}` : 'WAYPOINT SET');
}
function clearWP() {
  wp = null;
  if (wpMk) { wpMk.remove(); wpMk = null; }
  if (map && map.getSource('route')) map.getSource('route').setData({ type: 'FeatureCollection', features: [] });
  document.getElementById('dist').style.display = 'none';
  document.getElementById('wpdot').style.opacity = '.28';
  document.getElementById('deta').textContent = '';
  toast('WAYPOINT CLEARED');
}
// Enter close-up turn-by-turn style view
function startNav() {
  follow = true; updLocBtn();
  map.easeTo({ center: pLL, zoom: 16.5, bearing: headingUp ? heading : map.getBearing(), duration: 900 });
  applyHeading();
}

// ── ROUTING (OSRM) ─────────────────────────────────────
async function getRoute(from, to) {
  lastRouteAt = Date.now();
  let coords = [from, to];
  try {
    const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${from[0]},${from[1]};${to[0]},${to[1]}?overview=full&geometries=geojson`);
    const d = await r.json();
    if (d.routes?.[0]) {
      coords = d.routes[0].geometry.coordinates;
      setDistM(d.routes[0].distance, d.routes[0].duration);
    }
  } catch {}
  if (map.getSource('route')) {
    map.getSource('route').setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: coords } });
  }
}

// ── DISTANCE / ETA ─────────────────────────────────────
function updDist(ll) { setDistM(hvs(pLL[1], pLL[0], ll[1], ll[0]), null); }
function setDistM(m, secs) {
  const e = document.getElementById('dval');
  if (e) e.textContent = m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(2) + ' km';
  const et = document.getElementById('deta');
  if (et && secs != null) {
    const min = Math.round(secs / 60);
    et.textContent = min < 60 ? `~${min} MIN` : `~${Math.floor(min / 60)}H ${min % 60}M`;
  }
}
function hvs(a, b, c, d) {
  const R = 6371e3, r = Math.PI / 180, dφ = (c - a) * r, dλ = (d - b) * r;
  const x = Math.sin(dφ / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin(dλ / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
}
function circlePoly(lng, lat, rM, pts = 48) {
  const c = [], dLat = rM / 111320, dLng = rM / (111320 * Math.cos(lat * Math.PI / 180));
  for (let i = 0; i <= pts; i++) { const a = i / pts * 2 * Math.PI; c.push([lng + dLng * Math.cos(a), lat + dLat * Math.sin(a)]); }
  return { type: 'Feature', geometry: { type: 'Polygon', coordinates: [c] } };
}

// ── GPS ────────────────────────────────────────────────
function startGPS() {
  if (!navigator.geolocation) { toast('NO GPS SUPPORT'); return; }
  navigator.geolocation.watchPosition(p => {
    const { latitude: lat, longitude: lng, heading: h, accuracy: acc } = p.coords;
    const prev = pLL;
    pLL = [lng, lat];
    if (pMk) pMk.setLngLat(pLL);
    if (map.getSource('acc') && acc != null) map.getSource('acc').setData(circlePoly(lng, lat, acc));
    if (!gotFix) {
      gotFix = true; follow = true; updLocBtn();
      map.easeTo({ center: pLL, zoom: 16, duration: 800 });
      toast('GPS LOCKED');
    }
    if (h != null && !isNaN(h)) { heading = h; applyHeading(); }
    if (follow) map.easeTo({ center: pLL, duration: 500 });
    if (wp) {
      updDist(wp);
      if (Date.now() - lastRouteAt > 12000 && hvs(prev[1], prev[0], lat, lng) > 25) getRoute(pLL, wp);
    }
  }, err => {
    toast(err.code === 1 ? 'GPS PERMISSION DENIED' : 'GPS UNAVAILABLE');
  }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
}

// ── POI LOADING (Overpass) ─────────────────────────────
let poiTmr;
async function loadPOIs() {
  if (!styleReady || !map.getSource('poi')) return;
  if (map.getZoom() < 14) { map.getSource('poi').setData({ type: 'FeatureCollection', features: [] }); return; }
  clearTimeout(poiTmr);
  poiTmr = setTimeout(async () => {
    const b = map.getBounds();
    const q = `[out:json][timeout:12];node["amenity"~"restaurant|cafe|fast_food|fuel|hospital|pharmacy|bank|bar|hotel|supermarket|police|parking|pub|atm|school|convenience"](${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()});out body;`;
    try {
      const r = await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(q)}`);
      const d = await r.json();
      const feats = d.elements.slice(0, 200).filter(el => el.lat && el.lon).map(el => {
        const { c, t } = pSt(el.tags.amenity);
        return { type: 'Feature', geometry: { type: 'Point', coordinates: [el.lon, el.lat] },
          properties: { color: c, type: t, name: el.tags.name || t, street: el.tags['addr:street'] || '' } };
      });
      map.getSource('poi').setData({ type: 'FeatureCollection', features: feats });
    } catch {}
  }, 700);
}
function buildPoiPopup(nm, t, street, c) {
  const wrap = document.createElement('div');
  const mk = (txt, css) => { const d = document.createElement('div'); d.style.cssText = css; d.textContent = txt; return d; };
  wrap.appendChild(mk(nm, "font:600 15px 'Oswald',sans-serif;letter-spacing:.5px;"));
  wrap.appendChild(mk(t, "font:400 12px 'Oswald';color:#aaa;margin-top:2px;"));
  if (street) wrap.appendChild(mk(street, "font:400 11px 'Oswald';color:#888;margin-top:1px;"));
  const btn = document.createElement('button');
  btn.className = 'pop-wp-btn'; btn.textContent = 'SET WAYPOINT ✚';
  btn.addEventListener('click', () => { setWP([c[0], c[1]], nm); map._popups && map._popups.forEach(p => p.remove()); document.querySelectorAll('.maplibregl-popup').forEach(p => p.remove()); });
  wrap.appendChild(btn);
  return wrap;
}
function pSt(a) {
  return ({
    restaurant: { c: '#e8780a', t: 'Restaurant' }, cafe: { c: '#cc6600', t: 'Café' },
    fast_food: { c: '#ff4400', t: 'Fast Food' }, fuel: { c: '#f0d000', t: 'Gas Station' },
    hospital: { c: '#dd2222', t: 'Hospital' }, pharmacy: { c: '#00cc44', t: 'Pharmacy' },
    bank: { c: '#00aa22', t: 'Bank' }, atm: { c: '#009900', t: 'ATM' },
    bar: { c: '#aa0033', t: 'Bar' }, pub: { c: '#aa0033', t: 'Pub' },
    hotel: { c: '#aa44cc', t: 'Hotel' }, supermarket: { c: '#00aaee', t: 'Supermarket' },
    convenience: { c: '#0088cc', t: 'Convenience' }, police: { c: '#2244dd', t: 'Police' },
    parking: { c: '#6688aa', t: 'Parking' }, school: { c: '#ccaa00', t: 'School' }
  })[a] || { c: '#888888', t: a || 'Place' };
}

// ── SEARCH (Nominatim) ─────────────────────────────────
let stmr;
function sched(v) {
  clearTimeout(stmr);
  if (!v.trim()) { hideR(); return; }
  stmr = setTimeout(() => doS(v), 380);
}
async function doS(q) {
  if (!q.trim()) return;
  const el = document.getElementById('sres');
  el.innerHTML = `<div style="padding:9px 12px;color:#888;font:400 11px 'Oswald',sans-serif;letter-spacing:1px;">SEARCHING WINNIPEG...</div>`;
  el.style.display = 'block';
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&viewbox=-97.39,50.02,-96.92,49.77&bounded=1&format=json&limit=6&addressdetails=1`,
      { headers: { 'Accept-Language': 'en' } });
    SR = await r.json();
    if (!SR.length) { el.innerHTML = `<div style="padding:9px 12px;color:#666;font:400 11px 'Oswald',sans-serif;letter-spacing:1px;">NO RESULTS FOUND IN WINNIPEG</div>`; return; }
    el.innerHTML = '';
    SR.forEach((x, i) => {
      const parts = x.display_name.split(',');
      const row = document.createElement('div');
      row.className = 'sr-row';
      row.style.cssText = 'padding:9px 12px;cursor:pointer;border-bottom:1px solid #1a1814;color:#ddd;';
      const a = document.createElement('div'); a.style.cssText = "font:600 13px 'Oswald',sans-serif;color:white;letter-spacing:.5px;"; a.textContent = parts[0];
      const b = document.createElement('div'); b.style.cssText = "font:400 11px 'Oswald',sans-serif;color:#666;margin-top:1px;"; b.textContent = parts.slice(1, 3).join(',').trim();
      row.appendChild(a); row.appendChild(b);
      row.addEventListener('mousedown', e => { e.preventDefault(); pickR(i); });
      el.appendChild(row);
    });
  } catch {
    el.innerHTML = `<div style="padding:9px 12px;color:#cc5500;font:400 11px 'Oswald',sans-serif;letter-spacing:.5px;">SEARCH UNAVAILABLE</div>`;
  }
}
function pickR(i) {
  const x = SR[i];
  if (!x) return;
  const name = x.display_name.split(',')[0];
  setWP([parseFloat(x.lon), parseFloat(x.lat)], name);  // also draws route + zooms in (startNav)
  document.getElementById('srch').value = name;
  document.getElementById('srch').blur();
  hideR();
}
function hideR() { document.getElementById('sres').style.display = 'none'; }

// ── UTILS ──────────────────────────────────────────────
function toggleZoom() {
  zoomed = !zoomed;
  map.easeTo({ center: follow ? pLL : map.getCenter(), zoom: zoomed ? 11 : 16, duration: 1000 });
  toast(zoomed ? 'OVERVIEW MAP' : 'STREET VIEW');
}
function showHelp() { toast('TAP MAP = WAYPOINT · ◎ = FOLLOW · N = ROTATE · M = ZOOM · ◆ = CLEAR'); }
function toast(m) {
  const t = document.getElementById('tst');
  t.textContent = m; t.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.style.display = 'none', 2900);
}
</script>
